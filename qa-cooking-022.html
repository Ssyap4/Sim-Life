<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sim-Life — restaurant dishes QA gallery</title>
<style>
  body{margin:0;background:#e9e1d5;color:#3a302a;font:14px system-ui,sans-serif}
  h1{margin:16px 0 8px;text-align:center;font-size:21px}
  p{text-align:center;margin:8px}
  #gallery{position:relative;margin:14px auto;width:840px;height:840px;background:#eee6da;border-radius:16px;overflow:hidden}
  canvas{width:840px;height:840px;display:block}
  .label{position:absolute;bottom:auto;max-width:195px;width:195px;height:25px;text-align:center;
    font-size:12px;line-height:25px;font-weight:650;background:#fffdf8d9;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head>
<body><h1>Ресторанные блюда • геометрия в игре</h1>
<p id="status">Подготовка сцены...</p>
<div id="gallery"><canvas id="plateCanvas" width="840" height="840"></canvas></div>
<script type="module">
import * as THREE from 'three';
import {selectIndoorDish,ceramicPlate} from './src/game/MealArt.ts';
import {RECIPES} from './src/shared/food.ts';
const ids=['lasagna','mushroomRisotto','beefStroganoff','salmonLemon',
  'creamyChicken','shrimpLinguine','duckOrange','pepperMedallions','pannaCotta',
  'cremeBrulee','lambRosemary','beefWellington','seaBassRisotto','chocolateFondant'];
const canvas=document.querySelector('#plateCanvas');
const tile=210;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(tile*4,tile*4,false);
renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0xb6a593,2));
const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(-.6,2,2);scene.add(light);
const camera=new THREE.PerspectiveCamera(38,1,.1,20);
camera.position.set(0,.62,.69);camera.lookAt(0,.038,0);
const food=new THREE.Group();scene.add(food);
const gl=renderer.getContext();
const hashes=[];
for(const [i,id] of ids.entries()){
  food.clear();
  food.add(ceramicPlate());
  const contents=new THREE.Group();
  selectIndoorDish(contents,id);
  food.add(contents);
  const left=(i%4)*tile,bottom=(3-Math.floor(i/4))*tile;
  renderer.setViewport(left,bottom,tile,tile);
  renderer.setScissor(left,bottom,tile,tile);
  renderer.setScissorTest(true);
  renderer.setClearColor(0xf5f0e8);
  renderer.clear(true,true,true);
  renderer.render(scene,camera);
  const pixels=new Uint8Array(120*120*4);
  gl.readPixels(left+45,bottom+45,120,120,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  let hash=2166136261;
  for(let j=0;j<pixels.length;j+=4) {
    hash=Math.imul(hash ^ pixels[j],16777619)>>>0;
    hash=Math.imul(hash ^ pixels[j+1],16777619)>>>0;
    hash=Math.imul(hash ^ pixels[j+2],16777619)>>>0;
  }
  hashes.push(hash.toString(16));
  const label=document.createElement('div');
  label.className='label';label.textContent=RECIPES[id].name;label.dataset.recipe=id;
  label.style.left=(left+7)+'px';
  label.style.top=(Math.floor(i/4)*tile+174)+'px';
  document.querySelector('#gallery').append(label);
}
renderer.setScissorTest(false);
document.body.dataset.qaReady='true';
document.body.dataset.count=String(ids.length);
document.body.dataset.distinct=String(new Set(hashes).size);
document.body.dataset.hashes=hashes.join(',');
document.querySelector('#status').textContent='Показано '+ids.length+' отдельных 3D-моделей блюд';
</script>
</body></html>

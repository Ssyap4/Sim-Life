name: SimOurHome 0.59 title and launcher
on:
  push:
    branches: [feat/simourhome-059]
permissions:
  contents: read
jobs:
  visual:
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, mobile, secure]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-title-059.mjs ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simourhome-title-${{ matrix.mode }}
          path: /tmp/simourhome-059-${{ matrix.mode }}
          retention-days: 7
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

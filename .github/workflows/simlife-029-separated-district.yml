name: Sim-Life 0.29 separated district QA
on:
  push:
    branches: [feat/separate-home-district-courier-029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsx --test server/tests/separated-district-029.test.ts server/tests/neighborhood-018.test.ts server/tests/neighbors.test.ts server/tests/comfort-autonomy-029.test.ts server/tests/autonomy.test.ts server/tests/petFurniture-028.test.ts server/tests/simbaOccupancy-028.test.ts

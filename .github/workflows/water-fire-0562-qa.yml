name: Water and fire 0.56.2 mobile visuals
on:
  push:
    branches: [feat/water-fire-0562]
permissions:
  contents: read
jobs:
  visual:
    strategy:
      fail-fast: false
      matrix:
        mode: [home, spa, district, park]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-water-fire-0562.mjs ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-fire-${{ matrix.mode }}
          path: /tmp/simlife-water-fire-${{ matrix.mode }}
          retention-days: 7

name: Sim-Life 0.33 wardrobe prototype
on:
  push:
    branches: [feat/wardrobe-033]
    paths: ['art/characters/**.py','src/game/Wardrobe.ts','qa-wardrobe-033.html','scripts/qa-033-wardrobe.mjs','.github/workflows/simlife-033-wardrobe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wardrobe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bpy==4.5.3
      - name: Export both residents in the cloud
        run: |
          python art/characters/generate.py -- vlad
          python art/characters/generate.py -- alina
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx --test server/tests/wardrobe-033.test.ts
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: |
          npx vite --host 127.0.0.1 --port 4173 >/tmp/wardrobe-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/qa-wardrobe-033.html >/dev/null && break; sleep 1; done
          node scripts/qa-033-wardrobe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wardrobe-mobile-frames
          path: /tmp/simlife-033-wardrobe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wardrobe-export
          path: |
            src/assets/characters/vlad.glb
            src/assets/characters/alina.glb
            art/characters/vlad.blend
            art/characters/alina.blend
      - name: Publish verified export to the prototype branch only
        if: success() && github.ref == 'refs/heads/feat/wardrobe-033'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/characters/{vlad,alina}.glb art/characters/{vlad,alina}.blend
          git diff --cached --quiet || git commit -m 'art: export wardrobe prototype assets'
          git push origin HEAD:feat/wardrobe-033

name: Sim-Life 0.41 PULSE mobile QA
on:
  push:
    branches: [feat/pulse-fitness-041]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fitness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: npx tsx --test server/tests/fitness-041.test.ts server/tests/family-car-wishes-029.test.ts server/tests/action-queue-019.test.ts
      - run: node --import tsx scripts/qa-041-fitness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitness-mobile
          path: /tmp/simlife-041-fitness
          retention-days: 7

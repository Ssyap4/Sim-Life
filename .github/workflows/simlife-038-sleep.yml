name: Sim-Life 0.38 natural sleep mobile visual
on:
  push:
    branches: [feat/natural-sleep-038]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-038-sleep.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sleep-mobile-frames
          path: /tmp/simlife-038-sleep
          retention-days: 7
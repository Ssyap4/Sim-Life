name: SimOurHome 0.63 resource lifecycle
on:
  push:
    branches: [feat/stability-063]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx --test server/tests/resources-063.test.ts server/tests/furniture-performance-060.test.ts server/tests/furniture-catalog-behavior.test.ts server/tests/furnishing-art.test.ts server/tests/location-finish-061.test.ts
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-performance-060.mjs
        env:
          SIM_STABILITY_AUDIT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-lifecycle-063
          path: /tmp/simourhome-060-performance
          retention-days: 7

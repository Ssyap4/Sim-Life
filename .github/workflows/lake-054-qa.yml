name: Lake club 0.54 initial visual
on:
  push:
    branches: [feat/lake-club-054]
    paths: ['src/**','server/**','scripts/qa-lake-054.mjs','.github/workflows/lake-054-qa.yml']
permissions:
  contents: read
jobs:
  visual:
    strategy:
      fail-fast: false
      matrix:
        mode: [day, night, fish, leisure, chat]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx --test server/tests/lake-054.test.ts server/tests/electronics-art-034.test.ts server/tests/spa-048.test.ts server/tests/venue-048.test.ts
      - run: node --import tsx scripts/qa-lake-054.mjs ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lake-054-${{ matrix.mode }}
          path: /tmp/simlife-lake-054-${{ matrix.mode }}
          retention-days: 7

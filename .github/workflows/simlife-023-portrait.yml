name: Sim-Life 0.23 mobile character and pet visual QA
on:
  push:
    branches: [feat/living-residents-pets-023]
    paths:
      - qa-living-023.html
      - scripts/qa-023-portrait-visual.mjs
      - .github/workflows/simlife-023-portrait.yml
      - src/game/Actor.ts
      - src/game/PetActor.ts
      - src/game/PetArt.ts
      - src/game/PetToys.ts
      - src/game/ResidentIdle.ts
      - src/game/PetIdle.ts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-portraits:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Serve original 3D source on isolated cloud host
        run: |
          npx vite --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/life-portrait-server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/qa-living-023.html >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/qa-living-023.html >/dev/null
      - name: Phone-scale visual portrait and rendering smoke check
        run: node scripts/qa-023-portrait-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simlife-023-vlad-alina-verdell-simba
          path: /tmp/simlife-023-portrait/
          retention-days: 7

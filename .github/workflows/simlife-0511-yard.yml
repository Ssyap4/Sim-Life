name: Sim-Life 0.51.1 yard and solo seating QA
on:
  push:
    branches: [fix/yard-polish-0511]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsx --test server/tests/yard-polish-0511.test.ts server/tests/lounge-polish-050.test.ts server/tests/terrace-free-rest-050.test.ts server/tests/oasis-pool-050.test.ts server/tests/player-copy-020.test.ts
      - run: npm run build
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-0511-yard.mjs ${{ matrix.device }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yard-${{ matrix.device }}
          path: /tmp/simlife-0511-yard
          retention-days: 7

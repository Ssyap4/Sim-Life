name: Sim-Life 0.44 care mobile QA
on:
  push:
    branches: [feat/vanity-care-044]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: npx tsx --test server/tests/vanity-044.test.ts server/tests/interior.test.ts
      - run: node --import tsx scripts/qa-044-care.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: care-mobile
          path: /tmp/simlife-044-care
          retention-days: 7

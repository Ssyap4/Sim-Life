name: SimOurHome 0.63 startup and stability
on:
  push:
    branches: [feat/stability-063]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsx --test server/tests/stability-063.test.ts server/tests/network.test.ts server/tests/mobile-refine-062.test.ts server/tests/performance.test.ts server/tests/car-ride-055.test.ts server/tests/notices-0592.test.ts
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-startup-063.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-063
          path: /tmp/simourhome-063-startup
          retention-days: 7

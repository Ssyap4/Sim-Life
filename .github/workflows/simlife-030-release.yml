name: Sim-Life 0.32 final release QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-release-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Full regression
        run: node --import tsx --test --test-concurrency=2 server/tests/*.test.ts
      - name: Functional catalog audit
        run: npm run audit:furniture
      - run: npm run build
      - name: Release isolation
        run: |
          node -e "if(require('./package.json').version!=='0.32.0')process.exit(1)"
          test -z "$(git ls-files server-data)"
          test -s dist/index.html
  mobile-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npx vite build
      - run: node --import tsx scripts/qa-032-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simlife-032-real-mobile-frames
          path: /tmp/simlife-032-visual
          retention-days: 7

name: Sim-Life 0.25 family budgeting and domestic QA
on:
  push:
    branches: [feat/family-finance-home-025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-and-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Strict TypeScript
        run: npm run check
      - name: Focused financial, saves and home regressions
        run: node --import tsx --test server/tests/family-budget-025.test.ts server/tests/billing.test.ts server/tests/market.test.ts server/tests/services.test.ts server/tests/home-media-pets-024.test.ts server/tests/social.test.ts
      - name: Production client build
        run: npx vite build

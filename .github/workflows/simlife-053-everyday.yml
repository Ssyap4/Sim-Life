name: Sim-Life 0.53 everyday QA
on:
  push:
    branches: [feat/living-everyday-053]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsx --test server/tests/workCoffee053.test.ts server/tests/dailyRoutine053.test.ts server/tests/autonomy.test.ts server/tests/familyAutonomy038.test.ts server/tests/nearbyTalk038.test.ts
      - run: npm run check
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-053-everyday.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everyday-053-mobile
          path: /tmp/simlife-053-everyday
          retention-days: 7

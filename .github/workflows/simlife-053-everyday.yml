name: Sim-Life 0.53 everyday QA
on:
  push:
    branches: [feat/living-everyday-053]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsx --test server/tests/animation053.test.ts server/tests/workCoffee053.test.ts server/tests/dailyRoutine053.test.ts server/tests/autonomy.test.ts server/tests/familyAutonomy038.test.ts server/tests/nearbyTalk038.test.ts server/tests/contact-polish-049.test.ts server/tests/polish-049.test.ts server/tests/blender.test.ts
      - run: npx tsx --test server/tests/seating053.test.ts server/tests/bodyVisual.test.ts server/tests/walkingGait.test.ts server/tests/blenderWalkingGait.test.ts server/tests/naturalSleep038.test.ts server/tests/furniture-functionality.test.ts server/tests/consoles-043.test.ts server/tests/leisure-032.test.ts
      - run: npx tsx --test server/tests/ufc053.test.ts server/tests/venue-048.test.ts server/tests/handheld053.test.ts server/tests/kitchen053.test.ts server/tests/cooking-visual.test.ts server/tests/mealtime.test.ts
      - run: npx tsx --test server/tests/embrace053.test.ts server/tests/pairContact053.test.ts server/tests/romance038.test.ts server/tests/relationships-046.test.ts
      - run: npm run check
  ufc-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/qa-053-ufc.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-screen-053
          path: /tmp/simlife-053-ufc
          retention-days: 7
  seating:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [iphone, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-053-seating.mjs ${{ matrix.profile }}
      - run: node --import tsx scripts/qa-053-handheld.mjs ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seating-053-${{ matrix.profile }}
          path: /tmp/simlife-053-seating-*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handheld-053-${{ matrix.profile }}
          path: /tmp/simlife-053-handheld-*
          retention-days: 7
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-053-everyday.mjs
      - run: node --import tsx scripts/qa-053-kitchen.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everyday-053-mobile
          path: /tmp/simlife-053-everyday
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-053-mobile
          path: /tmp/simlife-053-kitchen
          retention-days: 7

name: Sim-Life 0.32 leisure mobile frames
on:
  push:
    branches: [feat/leisure-032]
    paths: ['scripts/qa-032-visual.mjs', '.github/workflows/simlife-032-visual.yml']
permissions:
  contents: read
jobs:
  mobile-leisure:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npx vite build
      - run: node --import tsx scripts/qa-032-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simlife-032-mobile-frames
          path: /tmp/simlife-032-visual
          retention-days: 7

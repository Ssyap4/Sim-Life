name: SimOurHome 0.61 pet polish
on:
  push:
    branches: [feat/polish-061]
    paths:
      - 'src/game/PetActor.ts'
      - 'src/game/SimbaRig.ts'
      - 'src/game/PetMotion.ts'
      - 'src/game/PetPerformance.ts'
      - 'src/game/PetSocialMotion.ts'
      - 'src/game/PetToyMotion.ts'
      - 'scripts/qa-pet-toy-contact-061.mjs'
      - 'scripts/qa-053-pet-contact.mjs'
      - 'src/game/PetIdle.ts'
      - 'scripts/qa-pet-performance-061.mjs'
      - 'scripts/qa-pet-polish-061.mjs'
      - '.github/workflows/pets-polish-061.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx --test server/tests/pet-motion-049.test.ts server/tests/pet-toys-035.test.ts server/tests/simbaAuthoredRest-028.test.ts server/tests/verdell-bed.test.ts server/tests/dog-bath-035.test.ts server/tests/expressionPets053.test.ts server/tests/pet-feeders-035.test.ts server/tests/simbaOccupancy-028.test.ts server/tests/petMovementStress.test.ts server/tests/petPersonality.test.ts server/tests/petCommands-028.test.ts server/tests/pet-performance-061.test.ts
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-pet-performance-061.mjs
      - run: node --import tsx scripts/qa-pet-polish-061.mjs
      - run: node --import tsx scripts/qa-pet-toy-contact-061.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pet-polish-061
          path: |
            /tmp/simourhome-061-pets
            /tmp/simourhome-061-performances
            /tmp/simourhome-061-toys
          retention-days: 7
  contacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-053-pet-contact.mjs verdell
      - run: node --import tsx scripts/qa-053-pet-contact.mjs simba
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pet-contact-061
          path: /tmp/simlife-053-pet-contact
          retention-days: 7
name: Family life 0.56 visual
on:
  push:
    branches: [feat/family-calendar-056]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx --test server/tests/family-life-056.test.ts server/tests/calendar.test.ts server/tests/weekends-051.test.ts server/tests/lifeMoments037.test.ts
      - run: node --import tsx scripts/qa-family-life-056.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-life-056
          path: /tmp/simlife-family-life-056
          retention-days: 7

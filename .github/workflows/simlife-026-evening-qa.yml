name: Sim-Life 0.26 living together QA
on:
  push:
    branches: [feat/life-together-evenings-026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  living-evenings:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Strict TypeScript
        run: npm run check
      - name: Focused real two-player invitations, evening stages and family persistence
        run: node --import tsx --test server/tests/social.test.ts server/tests/family-budget-025.test.ts
      - name: Build production client
        run: npx vite build
      - name: Pack preview client
        uses: actions/upload-artifact@v4
        with:
          name: simlife-026-client-dist
          path: dist/
          if-no-files-found: error

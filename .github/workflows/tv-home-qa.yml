name: TV home visual comparison
on:
  push:
    branches: [qa/tv-home-053]
permissions:
  contents: read
jobs:
  visual:
    strategy:
      fail-fast: false
      matrix:
        tv: [tvStart, tvHD, tv4k, tvOLED]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-tv-home.mjs ${{ matrix.tv }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-home-${{ matrix.tv }}
          path: /tmp/tv-home-${{ matrix.tv }}
          retention-days: 7

name: Sim-Life 0.37 final release QA
on:
  push:
    branches: [feat/graphics-polish-037]
    paths: ['src/**','server/**','package.json','package-lock.json','.github/workflows/simlife-037-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

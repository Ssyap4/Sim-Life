name: SimOurHome 0.70 Azure Shore
on:
  push:
    branches: [feat/azure-resort-070]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx --test server/tests/grooming-070.test.ts server/tests/resort-070.test.ts server/tests/lake-054.test.ts server/tests/car-ride-055.test.ts server/tests/location-network.test.ts server/tests/consoles-043.test.ts server/tests/social.test.ts
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-resort-070.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-resort-070
          path: /tmp/simourhome-070-resort
          retention-days: 7

  grooming-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        pet: [verdell, simba]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-grooming-070.mjs ${{ matrix.pet }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grooming-070-${{ matrix.pet }}
          path: /tmp/simourhome-070-grooming-${{ matrix.pet }}
          retention-days: 7

  water-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-resort-water-070.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resort-water-070
          path: /tmp/simourhome-070-water
          retention-days: 7

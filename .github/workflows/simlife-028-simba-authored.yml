name: Sim-Life 0.28 authored Simba 3D rest QA
on:
  push:
    branches: [feat/simba-authored-furniture-rest-028, preview/simba-furniture-occupancy-028]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simba-actual-glb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx --test server/tests/simbaAuthoredRest-028.test.ts server/tests/catPerches-027.test.ts server/tests/simbaOccupancy-028.test.ts
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - name: Capture FIVE real WebGL furniture poses on 390x844 phone canvas
        run: node --import tsx scripts/qa-028-simba-authored.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simlife-028-simba-authored-real-frames
          path: /tmp/simlife-028-simba-authored
          if-no-files-found: warn
          retention-days: 7

name: SimOurHome 0.61 notice dock
on:
  push:
    branches: [feat/polish-061]
    paths:
      - 'src/main.ts'
      - 'src/glass-hud.css'
      - 'src/simourhome-059.css'
      - 'src/notificationsUI.ts'
      - 'scripts/qa-notice-dock-061.mjs'
      - '.github/workflows/notice-dock-061.yml'
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-notice-dock-061.mjs
      - run: node --import tsx scripts/qa-notices-0592.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notice-dock-061
          path: |
            /tmp/simourhome-061-notices
            /tmp/simourhome-0592
          retention-days: 7
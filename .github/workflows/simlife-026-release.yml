name: Sim-Life 0.26 final release regression
on:
  push:
    branches: [feat/life-together-evenings-026]
    paths:
      - .github/workflows/simlife-026-release.yml
      - package.json
      - package-lock.json
      - docs/RELEASE_026.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-release-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Strict TypeScript
        run: npm run check
      - name: Full authoritative game server and persistence regression
        run: npm test
      - name: Furniture catalog/navigation audit
        run: npm run audit:furniture
      - name: Production client/3D-model build
        run: npx vite build
      - name: Confirm the release version and absence of tracked family saves
        run: |
          node -e "if(require('./package.json').version!=='0.26.0')process.exit(1)"
          test -z "$(git ls-files server-data)"

name: SimOurHome HUD and furniture 0.59.3
on:
  push:
    branches: [feat/hud-furnishing-0593, feat/polish-060]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-hud-0593.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-furniture
          path: /tmp/simourhome-0593
          retention-days: 7

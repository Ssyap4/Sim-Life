name: Sim-Life 0.37 emotional expression mobile visual
on:
  push:
    branches: [feat/emotions-expression-037]
    paths: ['src/**','scripts/qa-037-expression.mjs','.github/workflows/simlife-037-expression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-037-expression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expression-mobile-frames
          path: /tmp/simlife-037-expression
          retention-days: 7

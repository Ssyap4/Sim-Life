name: SimOurHome 0.69 pet play
on:
  push:
    branches: [feat/pet-play-069]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx --test server/tests/dog-agility-069.test.ts server/tests/leisure-032.test.ts server/tests/cat-play-069.test.ts server/tests/pet-toys-035.test.ts server/tests/dog-training-035.test.ts server/tests/petCommands-028.test.ts server/tests/pet-shop-035.test.ts server/tests/petMovementStress.test.ts
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-cat-play-069.mjs
      - run: node --import tsx scripts/qa-dog-agility-069.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-play-069
          path: |
            /tmp/simourhome-069-cat
            /tmp/simourhome-069-agility
          retention-days: 7

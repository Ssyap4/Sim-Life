name: Sim-Life 0.45 character remake

on:
  push:
    branches: [feat/character-remake-045]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate skin, bind matrices, Blink and wardrobe
        run: node scripts/qa-character-assets.mjs
      - name: Test gameplay contacts and care
        run: npx tsx --test server/tests/blender.test.ts server/tests/blenderWalkingGait.test.ts server/tests/consoles-043.test.ts server/tests/vanity-044.test.ts server/tests/wardrobe-033.test.ts
      - run: npm run build

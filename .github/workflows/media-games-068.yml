name: Media and manual games 0.68 QA
on:
  push:
    branches: [feat/media-games-068]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx --test server/tests/media-068.test.ts server/tests/bowling-068.test.ts server/tests/tv-food-060.test.ts server/tests/venue-048.test.ts
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-media-games-068.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-media-games-068
          path: /tmp/simourhome-068-media-games
          retention-days: 7

name: Sim-Life 0.53 release regression
on:
  push:
    branches: [feat/living-everyday-053]
    paths: ['server/**', 'src/**', 'package.json', 'package-lock.json', '.github/workflows/simlife-053-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

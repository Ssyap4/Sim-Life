name: Sim-Life 0.38 mobile couple visual
on:
  push:
    branches: [feat/shared-activities-038]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  couple:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        action: [sofaLean, sofaHands, sofaKiss, sofaHug, bedRest, teaTogether, yardTea, musicTogether, yardRest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-038-couple.mjs ${{ matrix.action }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couple-${{ matrix.action }}
          path: /tmp/simlife-038-couple
          retention-days: 7
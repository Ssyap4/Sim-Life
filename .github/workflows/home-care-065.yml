name: SimOurHome 0.65 home care
on:
  push:
    branches: [feat/home-care-065]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --import tsx --test server/tests/home-comfort-065.test.ts server/tests/cooking-progression-019.test.ts server/tests/cooking-visual.test.ts server/tests/market.test.ts server/tests/readyFood.test.ts server/tests/tv-food-060.test.ts server/tests/food-quality.test.ts server/tests/home-care-065.test.ts server/tests/care-motion-065.test.ts server/tests/vanity-044.test.ts server/tests/barber-046.test.ts server/tests/dog-bath-035.test.ts server/tests/wishes-019.test.ts server/tests/needs-treats-030.test.ts
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-home-care-065.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-care-065
          path: /tmp/simourhome-065-care
          retention-days: 7

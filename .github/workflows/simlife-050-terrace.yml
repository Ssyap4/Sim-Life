name: Sim-Life 0.50 terrace mobile QA
on:
  push:
    branches: [feat/yard-oasis-050]
    paths: ['src/**','server/tests/oasis-050.test.ts','scripts/qa-050-terrace.mjs','.github/workflows/simlife-050-terrace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terrace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npx tsx --test server/tests/oasis-050.test.ts
      - run: npm run build
      - run: node --import tsx scripts/qa-050-terrace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrace-mobile
          path: /tmp/simlife-050-terrace
          retention-days: 7

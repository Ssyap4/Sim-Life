name: Sim-Life 0.43 consoles mobile QA
on:
  push:
    branches: [feat/console-gaming-043]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: npx tsx --test server/tests/consoles-043.test.ts server/tests/electronics-034.test.ts server/tests/electronics-art-034.test.ts server/tests/speaker-mount-040.test.ts server/tests/speakers-040.test.ts
      - run: node --import tsx scripts/qa-043-consoles.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-mobile
          path: /tmp/simlife-043-consoles
          retention-days: 7
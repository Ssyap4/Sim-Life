name: SimOurHome 0.61 final regression
on:
  push:
    branches: [feat/polish-061]
    paths:
      - '.github/workflows/final-061-regression.yml'
      - 'package.json'
      - 'server/tests/player-copy-020.test.ts'
      - 'server/tests/living-family-058.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --import tsx --test --test-concurrency=2 server/tests/*.test.ts
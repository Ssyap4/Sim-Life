name: SimOurHome 0.69 cozy and gifts
on:
  push:
    branches: [feat/pet-play-069]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx --test server/tests/cozy-gifts-069.test.ts server/tests/creative-hobbies-056.test.ts server/tests/context-events-056.test.ts server/tests/relationships-046.test.ts server/tests/furnishing-placement.test.ts server/tests/furniture-catalog-behavior.test.ts server/tests/furniture-design-families.test.ts server/tests/speaker-mount-040.test.ts server/tests/polish-049.test.ts server/tests/animation053.test.ts
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - run: node --import tsx scripts/qa-cozy-gifts-069.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cozy-gifts-069
          path: /tmp/simourhome-069-cozy
          retention-days: 7

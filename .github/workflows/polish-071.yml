name: SimOurHome 0.71 technical polish
on:
  push:
    branches: [feat/polish-071]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vite build --manifest
      - run: node scripts/precompress.mjs
      - run: node scripts/audit-startup-bundle.mjs
      - run: npx tsx --test server/tests/transport-071.test.ts server/tests/startup-071.test.ts server/tests/stability-063.test.ts server/tests/weather039.test.ts server/tests/car-ride-055.test.ts server/tests/performance.test.ts server/tests/location-network.test.ts server/tests/resort-070.test.ts server/tests/grooming-070.test.ts server/tests/network.test.ts server/tests/notices-0592.test.ts server/tests/static-transforms-071.test.ts server/tests/yard-polish-0511.test.ts server/tests/home-side-walls-061.test.ts server/tests/home-finish-061.test.ts server/tests/renovation-069.test.ts server/tests/location-frame-071.test.ts server/tests/homeFrame.test.ts
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test --test-concurrency=2 server/tests/autonomy.test.ts server/tests/bed-sleep-network.test.ts server/tests/bed-sleep.test.ts server/tests/simbaOccupancy-028.test.ts server/tests/comfort-autonomy-029.test.ts server/tests/living-family-058.test.ts server/tests/home-routines.test.ts server/tests/action-queue-019.test.ts server/tests/economy-plus.test.ts server/tests/billing.test.ts server/tests/time-speed.test.ts server/tests/recovery-064.test.ts server/tests/familyAutonomy038.test.ts server/tests/social.test.ts server/tests/androidGraphics-028.test.ts
      - run: node --import tsx --test --test-name-pattern='071 60 days' server/tests/long-play-064.test.ts
  motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test --test-concurrency=2 server/tests/poses.test.ts server/tests/animation053.test.ts server/tests/pairContact053.test.ts server/tests/seating053.test.ts server/tests/handheld053.test.ts server/tests/workCoffee053.test.ts server/tests/care-motion-065.test.ts server/tests/naturalSleep038.test.ts server/tests/dog-bath-035.test.ts server/tests/motion-polish-0581.test.ts server/tests/pet-motion-049.test.ts server/tests/pet-performance-061.test.ts server/tests/pets.test.ts server/tests/petTraffic.test.ts server/tests/petCommands-028.test.ts server/tests/cat-play-069.test.ts server/tests/pet-toys-035.test.ts
  browser:
    strategy:
      fail-fast: false
      matrix:
        scenario: [startup, resources, locations, resort, grooming, notices, resort-actions, groom-dog, groom-cat, seating-vlad, seating-alina, body-care]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - if: matrix.scenario == 'startup'
        run: node --import tsx scripts/qa-startup-063.mjs
      - if: matrix.scenario == 'resources'
        run: node --import tsx scripts/qa-performance-060.mjs
        env:
          SIM_STABILITY_AUDIT: '1'
      - if: matrix.scenario == 'locations'
        run: node --import tsx scripts/qa-performance-060.mjs
        env:
          SIM_LOCATION_AUDIT: '1'
      - if: matrix.scenario == 'resort' || matrix.scenario == 'grooming'
        run: node --import tsx scripts/qa-car-055.mjs "$MATRIX_SCENARIO"
        env:
          MATRIX_SCENARIO: ${{ matrix.scenario }}
          SIM_ARTIFACT_ONLY: '1'
      - if: matrix.scenario == 'notices'
        run: node --import tsx scripts/qa-notices-0592.mjs
      - if: matrix.scenario == 'resort-actions'
        run: node --import tsx scripts/qa-resort-070.mjs
      - if: matrix.scenario == 'groom-dog'
        run: node --import tsx scripts/qa-grooming-070.mjs verdell
      - if: matrix.scenario == 'groom-cat'
        run: node --import tsx scripts/qa-grooming-070.mjs simba
      - if: matrix.scenario == 'seating-vlad'
        run: node --import tsx scripts/qa-053-seating.mjs
      - if: matrix.scenario == 'seating-alina'
        run: node --import tsx scripts/qa-053-seating.mjs android
      - if: matrix.scenario == 'body-care'
        run: node --import tsx scripts/qa-home-care-065.mjs
        env:
          QA_GROUP: body
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polish-071-${{ matrix.scenario }}
          path: |
            /tmp/simourhome-063-startup
            /tmp/simourhome-060-performance
            /tmp/simlife-car-055-*
            /tmp/simourhome-0592
            /tmp/simourhome-070-resort
            /tmp/simourhome-070-grooming-*
            /tmp/simlife-053-seating-*
            /tmp/simourhome-065-care
          retention-days: 7

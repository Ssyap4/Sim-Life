name: Sim-Life 0.28 Pets real mobile QA
on:
  push:
    branches: [feat/pets-daily-life-028, feat/pets-animation-polish-028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pet-systems:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx tsx --test server/tests/petCommands-028.test.ts server/tests/petFurniture-028.test.ts server/tests/catPerches-027.test.ts server/tests/pets.test.ts server/tests/petNavigation.test.ts server/tests/petArt-028.test.ts
      - run: npm run audit:furniture
      - run: npx vite build
  real-iphone-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - name: Inspect Simba GLB, pet furniture, commands and mobile HUD on 390x844 / 320x568
        run: node --import tsx scripts/qa-028-pets.mjs
      - name: Film cat landing on a real purchased rotated sofa
        run: node --import tsx scripts/qa-027-cat-perch.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simlife-028-pets-real-iphone-frames
          path: |
            /tmp/simlife-028-pets-mobile
            /tmp/simlife-027-cat-perches-iphone
          retention-days: 7
          if-no-files-found: warn

  real-people-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - name: Capture real two-person synchronized gestures and in-world laptop
        run: node --import tsx scripts/qa-028-people.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simlife-028-real-couple-and-laptop
          path: /tmp/simlife-028-people-real-3d
          retention-days: 7
          if-no-files-found: warn

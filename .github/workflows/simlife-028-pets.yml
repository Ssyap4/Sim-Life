name: Sim-Life 0.28 Pets real mobile QA
on:
  push:
    branches: [feat/pets-daily-life-028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pet-systems:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx --test server/tests/petCommands-028.test.ts server/tests/petFurniture-028.test.ts server/tests/catPerches-027.test.ts server/tests/pets.test.ts server/tests/petNavigation.test.ts
      - run: npm run audit:furniture
      - run: npx vite build
  real-iphone-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - name: Inspect actual movable pet furniture and server commands on 390x844
        run: node --import tsx scripts/qa-028-pets.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simlife-028-pets-real-iphone-frames
          path: /tmp/simlife-028-pets-mobile
          retention-days: 7
          if-no-files-found: warn

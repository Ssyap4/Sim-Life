<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sim-Life 0.24 · Симба и Верделл</title><style>
body{margin:0;font:13px system-ui;background:#eae3d9;color:#3d322a}
h1{text-align:center;font-size:19px;margin:13px 0}
#scene{position:relative;width:390px;height:780px;margin:auto}
canvas{display:block;width:390px;height:780px}
.name{position:absolute;background:#fff9ebdd;border-radius:7px;padding:5px 9px;font-weight:700;max-width:183px;font-size:12px}
</style></head><body><h1>Симба · референс / Верделл · «зайка»</h1>
<div id="scene"><canvas width="390" height="780"></canvas></div>
<script type="module">
import * as THREE from 'three';
import {PetActor} from './src/game/PetActor.ts';
const canvas=document.querySelector('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(390,780,false);renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0xd0c0ae,2.2));
const sunlight=new THREE.DirectionalLight(0xfff8e9,2.5);sunlight.position.set(-1,3,4);scene.add(sunlight);
const options=[
 ['Симба · морда','simba',0],
 ['Симба · корпус','simba',1.18],
 ['Верделл · обычный','verdell',0],
 ['Верделл · просит «зайкой»','verdell',0],
];
const poses=[];
const petAmbient={satiety:79,energy:89,happiness:86,bond:75,bowl:2,personNearby:true};
for(let i=0;i<4;i++){
  const pet=new PetActor(options[i][1]);
  pet.setAmbient(petAmbient);
  if(i===3){
    for(let f=0;f<1450&&pet.currentIdleGesture()!=='beg';f++)pet.update(1/30);
    if(pet.currentIdleGesture()==='beg'){
      for(let k=0;k<23;k++)pet.update(1/30);
    }
  }else for(let f=0;f<20;f++)pet.update(1/30);
  pet.root.position.set(0,0,0);
  pet.root.rotation.y=options[i][2];
  poses.push(pet);
}
const box=document.querySelector('#scene');
for(let i=0;i<4;i++){
  const tag=document.createElement('span');tag.className='name';tag.textContent=options[i][0];
  tag.style.left=(i%2*195+7)+'px';tag.style.top=(Math.floor(i/2)*390+8)+'px';box.append(tag);
}
const hashes=[];
for(let i=0;i<4;i++){
  const pet=poses[i];
  scene.add(pet.root);
  const camera=new THREE.PerspectiveCamera(34,195/390,.1,20);
  if(i===1){camera.position.set(2.3,1.15,1.5);camera.lookAt(0,.5,0);}
  else{camera.position.set(.25,1.3,i<2?2.4:2.05);camera.lookAt(0,i<2?.53:.52,0);}
  const x=(i%2)*195,y=390*(1-Math.floor(i/2));
  renderer.setViewport(x,y,195,390);renderer.setScissor(x,y,195,390);
  renderer.setScissorTest(true);renderer.setClearColor(i%2?0xf7f1e7:0xece9e1);
  renderer.clear(true,true,true);renderer.render(scene,camera);
  const gl=renderer.getContext();
  const pixels=new Uint8Array(90*100*4);
  gl.readPixels(x+52,y+146,90,100,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  let h=2166136261;
  for(let j=0;j<pixels.length;j+=7)h=Math.imul(h^pixels[j],16777619)>>>0;
  hashes.push(h.toString(16));
  scene.remove(pet.root);
}
const dog=poses[3];const body=dog['body'],paws=dog['paws'];
const cat=poses[0]['head'];
document.body.dataset.begging=String(dog.currentIdleGesture()==='beg');
document.body.dataset.bothPaws=String(paws[0].position.y>.4 && paws[2].position.y>.4);
document.body.dataset.dogTilt=String(body.rotation.x);
document.body.dataset.catHead=String(cat.scale.x);
document.body.dataset.unique=String(new Set(hashes).size);
document.body.dataset.ready='true';
</script></body></html>
